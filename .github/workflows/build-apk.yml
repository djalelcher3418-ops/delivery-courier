# يبني ملف APK تلقائياً عند كل رفع للكود، وينشره في صفحة Releases للتنزيل من الهاتف
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org dz.delivery --project-name delivery_courier .

      - name: Configure Android (permissions, name, minSdk)
        run: python3 .github/scripts/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Courier-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Courier-apk
          path: Courier-${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: الموصّل — نسخة ${{ github.run_number }}
          body: نزّل ملف Courier-${{ github.run_number }}.apk على هاتفك وثبّته.
          files: Courier-${{ github.run_number }}.apk
